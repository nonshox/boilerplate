name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Dummy values — the build never calls Appwrite, it only reads config keys.
      APPWRITE_ENDPOINT: https://cloud.appwrite.io/v1
      APPWRITE_PROJECT_ID: ci
      APPWRITE_DATABASE_ID: ci
      APPWRITE_API_KEY: ci
      APPWRITE_STORAGE_BUCKET_ID: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
